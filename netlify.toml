# Plain static site: no build step. Netlify serves this folder as-is.
# The command is a deliberate no-op: Netlify treats an empty command as
# "unset" and falls back to the build command saved in the dashboard.
[build]
  publish = "."
  command = "echo 'No build step: static site'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
